<!DOCTYPE html>
<html lang="en">
<head>
  <title>No Kisses 😒</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body>

<!-- floating annoyed emojis -->
<div class="floaters">
  <span>😒</span><span>🙄</span><span>😤</span>
  <span>😑</span><span>😒</span><span>🙄</span>
</div>

<!-- MAIN CARD -->
<div class="card" id="mainCard">
  <h1>🚫 No Kisses For You</h1>

  <p class="sentence first">
    <span>No</span>
    <span>kisses</span>
    <span>for</span>
    <span>you</span>
  </p>

  <p class="sentence second">
    <span>cuz</span>
    <span>apparently</span>
    <span>I</span>
    <span>am</span>
    <span>annoying</span>
    <span>😒</span>
  </p>

  <div class="apology-zone" id="apologyZone">
    💕 since you apologized 💕
  </div>
</div>

<!-- KISS PAGE -->
<div class="kiss-page" id="kissPage">
  <div class="kiss-card">
    <h2>💋 i miss kissing you</h2>
    <p>i’d kiss you all day if i could</p>

    <!-- LOCAL GIF -->
    <img src="kiss.gif" alt="kiss gif" class="kiss-gif">
  </div>
</div>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#ff9a9e,#fad0c4);
  overflow-x: hidden;
}

/* MAIN CARD */
.card {
  max-width: 320px;
  margin: 100px auto;
  background: rgba(255,255,255,0.96);
  border-radius: 22px;
  padding: 30px 22px;
  text-align: center;
  box-shadow: 0 20px 45px rgba(0,0,0,0.25);
  position: relative;
  z-index: 2;
  transition: opacity .4s ease;
}

h1 {
  margin-top: 0;
  color: #d6336c;
}

/* WORD BY WORD */
.sentence span {
  opacity: 0;
  display: inline-block;
  margin-right: 6px;
  transform: translateY(20px) scale(0.85);
  animation: wordIn .5s ease forwards;
}

.first span:nth-child(1){animation-delay:.4s}
.first span:nth-child(2){animation-delay:.9s}
.first span:nth-child(3){animation-delay:1.4s}
.first span:nth-child(4){animation-delay:1.9s}

.second span:nth-child(1){animation-delay:2.6s}
.second span:nth-child(2){animation-delay:3.1s}
.second span:nth-child(3){animation-delay:3.6s}
.second span:nth-child(4){animation-delay:4.1s}
.second span:nth-child(5){animation-delay:4.6s}
.second span:nth-child(6){animation-delay:5.1s}

@keyframes wordIn {
  to { opacity:1; transform:translateY(0) scale(1); }
}

/* APOLOGY BUTTON */
.apology-zone {
  margin-top: 24px;
  padding: 14px 22px;
  background: linear-gradient(135deg,#ff69b4,#ff1493);
  color: white;
  border-radius: 25px;
  font-weight: bold;
  cursor: pointer;
  opacity: 0;
  transform: scale(.8);
  animation: reveal .8s ease 5.8s forwards;
}

@keyframes reveal {
  to { opacity:1; transform:scale(1); }
}

/* FLOATING EMOJIS */
.floaters span {
  position: fixed;
  bottom: -40px;
  font-size: 24px;
  animation: floatUp linear infinite;
  opacity: 0.8;
}

.floaters span:nth-child(1){left:10%;animation-duration:7s}
.floaters span:nth-child(2){left:25%;animation-duration:9s}
.floaters span:nth-child(3){left:40%;animation-duration:6s}
.floaters span:nth-child(4){left:55%;animation-duration:8s}
.floaters span:nth-child(5){left:70%;animation-duration:10s}
.floaters span:nth-child(6){left:85%;animation-duration:7s}

@keyframes floatUp {
  100% { transform:translateY(-110vh); opacity:0; }
}

/* KISS PAGE */
.kiss-page {
  position: fixed;
  inset: 0;
  background: rgba(255,182,193,.92);
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  visibility: hidden;
  transition: .4s ease;
  z-index: 10;
}

.kiss-page.active {
  opacity: 1;
  visibility: visible;
}

.kiss-card {
  background: white;
  border-radius: 28px;
  padding: 32px;
  text-align: center;
  box-shadow: 0 30px 60px rgba(0,0,0,0.35);
}

.kiss-card h2 {
  color: #ff1493;
  margin-top: 0;
}

.kiss-card p {
  color: #d6336c;
  font-size: 18px;
}

.kiss-gif {
  width: 170px;
  border-radius: 22px;
  margin-top: 16px;
  box-shadow: 0 10px 30px rgba(255,20,147,.35);
  animation: float 3s ease-in-out infinite;
}

@keyframes float {
  50% { transform: translateY(-8px) scale(1.04); }
}
</style>

<script>
document.getElementById("apologyZone").addEventListener("click", () => {
  document.getElementById("mainCard").style.opacity = "0";
  setTimeout(() => {
    document.getElementById("kissPage").classList.add("active");
  }, 300);
});
</script>

</body>
</html>
