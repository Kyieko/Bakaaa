<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Teddy Day! 🧸💕</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fad0c4 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }
        .teddy-emoji {
            font-size: 180px;
            cursor: pointer;
            transition: all 0.3s ease;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.2));
            margin-bottom: 20px;
        }
        .teddy-emoji:hover {
            transform: scale(1.1);
        }
        .teddy-emoji.hugging {
            animation: bigHug 1s ease-in-out;
        }
        @keyframes bigHug {
            0%, 100% { transform: scale(1) rotate(0deg); }
            25% { transform: scale(1.3) rotate(-8deg); }
            50% { transform: scale(1.4) rotate(8deg); }
            75% { transform: scale(1.35) rotate(-4deg); }
        }
        #hug-btn {
            background: linear-gradient(45deg, #ff6b9d, #ff8fab);
            color: white;
            border: none;
            padding: 18px 40px;
            font-size: 20px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(255,107,157,0.4);
            transition: all 0.3s;
            font-weight: bold;
        }
        #hug-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(255,107,157,0.6);
        }
        #message {
            margin-top: 25px;
            font-size: 28px;
            color: #fff;
            font-weight: bold;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.5);
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.6s;
        }
        #message.show {
            opacity: 1;
            transform: scale(1);
        }
        .heart {
            position: fixed;
            font-size: 30px;
            pointer-events: none;
            animation: floatUp 3s linear forwards;
            z-index: 100;
        }
        @keyframes floatUp {
            0% { 
                opacity: 1; 
                transform: translateY(0) scale(0) rotate(0deg); 
            }
            50% { 
                opacity: 1; 
                transform: translateY(-40vh) scale(1) rotate(180deg); 
            }
            100% { 
                opacity: 0; 
                transform: translateY(-80vh) scale(1.2) rotate(360deg); 
            }
        }
        h1 {
            position: absolute;
            top: 30px;
            background: linear-gradient(45deg, #ff69b4, #ff1493);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 42px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Happy Teddy Day! 🧸💕</h1>
    
    <div class="teddy-emoji" id="teddy">🧸</div>
    
    <button id="hug-btn">🤗 Give Me a Hug!</button>
    <div id="message">Biggest teddy hug for you! 🧸❤️</div>

    <script>
        const teddy = document.getElementById('teddy');
        const btn = document.getElementById('hug-btn');
        const message = document.getElementById('message');
        let hugCount = 0;

        const wishes = [
            '💋 I missss yuuuu Bakaa!',
            '🥰 Squeeeeze!',
            '💕 Love you zaa mosttttt!',
            '😘🙃😘😘🤤😘😘🤓😘',
            '😍 Endless hugs!'
        ];

        function createHeart() {
            const heart = document.createElement('div');
            heart.textContent = ['💕','❤️','💖','🧡','💝','🌸'][Math.floor(Math.random() * 6)];
            heart.className = 'heart';
            heart.style.left = (Math.random() * 80 + 10) + 'vw';
            heart.style.animationDuration = (Math.random() * 1 + 2.5) + 's';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 3000);
        }

        // 🎵 Cute hug sound (no files)
        let audioCtx;
        function playHugSound() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(880, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(440, audioCtx.currentTime + 0.15);

            gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
        }

        function triggerHug() {
            playHugSound(); // 🧸💖 sound on hug
            hugCount++;
            teddy.classList.add('hugging');
            message.textContent = wishes[hugCount % wishes.length];
            message.classList.add('show');

            // Heart explosion
            for (let i = 0; i < 25; i++) {
                setTimeout(createHeart, i * 60);
            }

            setTimeout(() => {
                teddy.classList.remove('hugging');
                setTimeout(() => message.classList.remove('show'), 400);
            }, 1200);
        }

        teddy.addEventListener('click', triggerHug);
        btn.addEventListener('click', triggerHug);

        // Auto first hug
        setTimeout(triggerHug, 1000);
    </script>
</body>
</html>
