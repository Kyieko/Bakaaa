<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Teddy Day! 🧸💕</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(-45deg, #ff9a9e, #fecfef, #fad0c4, #ffd1ff, #ff9a9e);
            background-size: 400% 400%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            animation: gradientShift 8s ease infinite;
        }
        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .stars {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        .star {
            position: absolute;
            width: 2px; height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle 2s infinite;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.5); }
        }

        h1 {
            position: absolute;
            top: 30px;
            background: linear-gradient(45deg, #ff69b4, #ff1493, #ff69b4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 42px;
            font-weight: bold;
            z-index: 10;
        }

        .teddy-container {
            position: relative;
            z-index: 5;
            text-align: center;
        }

        .teddy-emoji {
            font-size: 180px;
            cursor: pointer;
            transition: all 0.3s ease;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.2));
        }
        .teddy-emoji:hover { transform: scale(1.05); }
        .teddy-emoji.hugging {
            animation: hugAnim 1s ease-in-out;
        }
        @keyframes hugAnim {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.3) rotate(5deg); }
        }

        #hug-btn {
            background: linear-gradient(45deg, #ff6b9d, #ff8fab);
            color: white;
            border: none;
            padding: 18px 40px;
            font-size: 20px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(255,107,157,0.4);
            transition: all 0.3s;
            font-weight: bold;
            margin-top: 20px;
        }
        #hug-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(255,107,157,0.6);
        }
        #hug-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        #message {
            margin-top: 25px;
            font-size: 26px;
            color: #fff;
            font-weight: bold;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.8);
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.8s ease-out;
        }
        
        #message.show {
            opacity: 1 !important;
            transform: translateY(0);
            animation: textDance 4s ease-in-out 0.5s infinite;
        }

        @keyframes textDance {
            0%, 100% { 
                transform: translateY(0) rotate(0deg) scale(1); 
                text-shadow: 2px 2px 6px rgba(0,0,0,0.8), 0 0 20px #ff69b4;
            }
            20% { 
                transform: translateY(-8px) rotate(-1deg) scale(1.02); 
                text-shadow: 2px 2px 6px rgba(0,0,0,0.8), 0 0 25px #ff1493;
            }
            40% { 
                transform: translateX(8px) rotate(1deg) scale(1.05); 
                text-shadow: 2px 2px 6px rgba(0,0,0,0.8), 0 0 30px #ff69b4;
            }
            60% { 
                transform: translateY(4px) rotate(-0.5deg) scale(1.03); 
                text-shadow: 2px 2px 6px rgba(0,0,0,0.8), 0 0 28px #ff1493;
            }
            80% { 
                transform: translateX(-5px) rotate(0.5deg) scale(1.01); 
                text-shadow: 2px 2px 6px rgba(0,0,0,0.8), 0 0 22px #ff69b4;
            }
        }

        .final-state {
            display: none;
            flex-direction: column;
            align-items: center;
            animation: bounceIn 1s ease-out;
        }
        .final-state.show {
            display: flex;
        }
        @keyframes bounceIn {
            0% { opacity: 0; transform: scale(0.5); }
            60% { opacity: 1; transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .final-teddy {
            font-size: 200px;
            filter: drop-shadow(0 20px 40px rgba(0,0,0,0.3));
            animation: annoyedShake 2s infinite;
        }
        @keyframes annoyedShake {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-10px) rotate(-2deg); }
            75% { transform: translateY(-5px) rotate(2deg); }
        }

        #final-message {
            font-size: 36px;
            color: #ffd700;
            text-shadow: 0 0 20px #ffd700, 2px 2px 6px rgba(0,0,0,0.5);
            margin-top: 20px;
        }

        .heart {
            position: fixed;
            font-size: 30px;
            pointer-events: none;
            animation: floatUp 4s linear forwards;
            z-index: 20;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(0) rotate(0deg); }
            50% { opacity: 1; transform: translateY(-40vh) scale(1) rotate(180deg); }
            100% { opacity: 0; transform: translateY(-80vh) scale(1.2) rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>
    
    <h1>Happy Teddy Day! 🧸💕</h1>
    
    <div class="teddy-container" id="normalState">
        <div class="teddy-emoji" id="teddy">🧸</div>
        <button id="hug-btn">🤗 Give Me a Hug!</button>
        <div id="message">Click BUTTON for hugs! 🧸💖</div>
    </div>

    <div class="final-state" id="finalState">
        <div class="final-teddy">😒</div>
        <div id="final-message">😒 ENOUGH HUGS FOR THE TEDDY! ✋</div>
    </div>

    <script>
        class TeddyDayApp {
            constructor() {
                this.teddy = document.getElementById('teddy');
                this.btn = document.getElementById('hug-btn');
                this.message = document.getElementById('message');
                this.normalState = document.getElementById('normalState');
                this.finalState = document.getElementById('finalState');
                
                this.hugCount = 0;
                
                this.wishes = [
                    '🥰 Squeeeeze tight!',
                    '💋 I missss yuuuu Bakaa!',
                    '💕 Love you zaa mosttttt!',
                    '😘 Okay now stop!',
                    '🤤 You\'re my favorite teddy!',
                    '🤓💋💋💋🫠🫠🫠❤️😘😘😘😘',
                    '✋ okay now stop',
                    '🛑 I said stoppp 😤',
                    '❌ No more hugs for za teddy 🧸'
                ];

                this.initStars();
                this.bindEvents();
            }

            initStars() {
                const starsContainer = document.getElementById('stars');
                for (let i = 0; i < 80; i++) {
                    const star = document.createElement('div');
                    star.className = 'star';
                    star.style.left = Math.random() * 100 + '%';
                    star.style.top = Math.random() * 60 + '%';
                    star.style.animationDelay = Math.random() * 2 + 's';
                    starsContainer.appendChild(star);
                }
            }

            bindEvents() {
                this.btn.addEventListener('click', () => this.triggerHug());
                this.teddy.addEventListener('click', () => this.teddyHugOnly());
            }

            playHugSound() {
                try {
                    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.15);
                    
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
                    
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.2);
                } catch(e) {}
            }

            createHeartExplosion() {
                for (let i = 0; i < 25; i++) {
                    setTimeout(() => this.createHeart(), i * 60);
                }
            }

            createHeart() {
                const heart = document.createElement('div');
                heart.textContent = ['💕','❤️','💖','🧡','💝'][Math.floor(Math.random() * 5)];
                heart.className = 'heart';
                heart.style.left = (Math.random() * 80 + 10) + 'vw';
                document.body.appendChild(heart);
                setTimeout(() => heart.remove(), 4000);
            }

            teddyHugOnly() {
                this.playHugSound();
                this.teddy.classList.add('hugging');
                this.createHeartExplosion();
                setTimeout(() => {
                    this.teddy.classList.remove('hugging');
                }, 1200);
            }

            triggerHug() {
                if (this.hugCount >= 9) return;
                
                this.hugCount++;
                
                this.playHugSound();
                
                // FORCE clear any existing classes first
                this.message.classList.remove('show');
                this.message.textContent = this.wishes[Math.min(this.hugCount - 1, this.wishes.length - 1)];
                
                // Force reflow
                this.message.offsetHeight;
                
                // Add show class to trigger animation
                this.message.classList.add('show');
                this.teddy.classList.add('hugging');
                this.createHeartExplosion();
                
                setTimeout(() => {
                    this.teddy.classList.remove('hugging');
                    this.message.classList.remove('show');
                    
                    if (this.hugCount === 9) {
                        setTimeout(() => this.showFinalState(), 500);
                    }
                }, 6500); // 6.5 seconds total
            }

            showFinalState() {
                this.normalState.style.display = 'none';
                this.finalState.classList.add('show');
                this.btn.disabled = true;
            }
        }

        window.addEventListener('load', () => {
            new TeddyDayApp();
        });
    </script>
</body>
</html>
