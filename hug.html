<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Hug Day 🤗</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
    font-family:'Poppins',sans-serif;
    background:linear-gradient(135deg,#667eea,#764ba2);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

.container{
    max-width:500px;
    width:90%;
    text-align:center;
    padding:40px 20px;
    border-radius:20px;
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(10px);
    box-shadow:0 20px 50px rgba(0,0,0,0.3);
}

.title{
    font-family:'Dancing Script',cursive;
    font-size:clamp(2.5rem,8vw,4.5rem);
    color:#fff;
    margin-bottom:10px;
}

.subtitle{
    color:rgba(255,255,255,0.9);
    margin-bottom:20px;
    font-size:1.2rem;
}

.hug-gif{
    width:100%;
    max-width:400px;
    height:250px;
    object-fit:cover;
    border-radius:20px;
    margin:20px 0 30px;
    border:6px solid rgba(255,255,255,0.2);
    box-shadow:0 20px 40px rgba(0,0,0,0.4);
}

.hug-btn{
    background:linear-gradient(45deg,#ff6b9d,#c44569);
    color:#fff;
    border:none;
    padding:16px 42px;
    font-size:1.2rem;
    font-weight:600;
    border-radius:50px;
    cursor:pointer;
    transition:0.3s ease;
}

.hug-btn:hover{
    transform:translateY(-6px) scale(1.05);
    box-shadow:0 20px 40px rgba(255,107,157,0.6);
}
</style>
</head>

<body>

<div class="container">
    <h1 class="title">🐼 Happy Hug Day 😘</h1>
    <p class="subtitle">A little virtual hug to make you smile 💕</p>

    <img
        class="hug-gif"
        src="https://media.giphy.com/media/IzXiddo2twMmdmU8Lv/giphy.gif"
        alt="Milk and Mocha Hug"
    >

    <button class="hug-btn" onclick="openHug()">I miss giving you tight hugs 🤧</button>
</div>

<script>
function openHug(){
    const hugPage = `
    <!DOCTYPE html>
    <html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Warm Hug 💖</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet">

    <style>
    body{
        margin:0;
        font-family:'Poppins',sans-serif;
        background:linear-gradient(135deg,#ff9a9e,#fad0c4);
        min-height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        overflow:hidden;
    }
    .box{
        text-align:center;
        padding:40px 20px;
    }
    img{
        max-width:400px;
        width:100%;
        border-radius:20px;
        box-shadow:0 20px 40px rgba(0,0,0,0.3);
    }
    .msg{
        font-family:'Dancing Script',cursive;
        font-size:clamp(2rem,6vw,3rem);
        color:#fff;
        margin-top:25px;
        animation:beat 1.5s infinite;
    }
    @keyframes beat{
        0%,100%{transform:scale(1);}
        50%{transform:scale(1.05);}
    }
    </style>
    </head>

    <body>
    <div class="box">
        <img src="https://media.giphy.com/media/XQLerr4AvPJpwHq63x/giphy.gif">
        <div class="msg">
            me when i see you next time 💋💋😘😘💕
        </div>
    </div>
    </body>
    </html>
    `;

    const newTab = window.open();
    newTab.document.write(hugPage);
    newTab.document.close();
}
</script>

</body>
</html>
