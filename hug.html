<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Hug Day 💕</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Dancing+Script:wght@400;700&family=Quicksand:wght@400;500&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
    font-family:'Poppins',sans-serif;
    background:linear-gradient(135deg,#a8edea 0%,#fed6e3 50%,#ffecd2 100%);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    position:relative;
}

body::before{
    content:'💕';
    position:fixed;
    font-size:2rem;
    animation:float 6s infinite linear;
    pointer-events:none;
    z-index:1;
}

@keyframes float{
    0%{transform:translateY(100vh) rotate(0deg);opacity:0;}
    10%{opacity:1;}
    90%{opacity:1;}
    100%{transform:translateY(-100px) rotate(360deg);opacity:0;}
}

.container{
    max-width:450px;
    width:90%;
    text-align:center;
    padding:50px 25px;
    border-radius:30px;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(20px);
    box-shadow:0 25px 60px rgba(0,0,0,0.2);
    position:relative;
    z-index:10;
}

.title{
    font-family:'Dancing Script',cursive;
    font-size:clamp(2.8rem,9vw,5rem);
    background:linear-gradient(45deg,#ff9a8b,#fecfef,#a8e6cf);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
    margin-bottom:15px;
    text-shadow:0 4px 20px rgba(255,255,255,0.3);
    animation:glow 2s ease-in-out infinite alternate;
}

@keyframes glow{
    from{text-shadow:0 0 20px rgba(255,182,193,0.5);}
    to{text-shadow:0 0 30px rgba(255,182,193,0.8),0 0 40px #ffb6c1;}
}

.subtitle{
    color:rgba(255,255,255,0.95);
    margin-bottom:25px;
    font-size:1.25rem;
    font-weight:300;
    font-family:'Quicksand',sans-serif;
    letter-spacing:0.5px;
}

.hug-gif{
    width:100%;
    max-width:380px;
    height:260px;
    object-fit:cover;
    border-radius:25px;
    margin:25px 0 35px;
    border:8px solid rgba(255,255,255,0.25);
    box-shadow:0 25px 50px rgba(0,0,0,0.3),inset 0 2px 10px rgba(255,255,255,0.2);
    transition:transform 0.3s ease;
}

.hug-gif:hover{
    transform:scale(1.02);
}

.hug-btn{
    background:linear-gradient(45deg,#ff9a8b,#fecfef,#a8e6cf);
    color:#fff;
    border:none;
    padding:18px 50px;
    font-size:1.25rem;
    font-weight:600;
    border-radius:50px;
    cursor:pointer;
    font-family:'Quicksand',sans-serif;
    text-transform:uppercase;
    letter-spacing:1px;
    box-shadow:0 15px 35px rgba(255,154,139,0.4);
    transition:all 0.4s cubic-bezier(0.175,0.885,0.32,1.275);
    position:relative;
    overflow:hidden;
}

.hug-btn::before{
    content:'';
    position:absolute;
    top:0;left:-100%;
    width:100%;height:100%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,0.3),transparent);
    transition:left 0.7s;
}

.hug-btn:hover::before{left:100%;}
.hug-btn:hover{
    transform:translateY(-8px) scale(1.05);
    box-shadow:0 25px 50px rgba(255,154,139,0.6);
}
.hug-btn:active{transform:scale(0.98);}

@media(max-width:480px){
    .container{padding:40px 20px;}
    .hug-btn{padding:16px 40px;font-size:1.1rem;}
}
</style>
</head>

<body>

<div class="container">
    <h1 class="title">🐼 Happy Hug Day 😗</h1>
    <p class="subtitle">The cutest hug to make your heart flutter 💕✨</p>

    <!-- Milk & Mocha FIRST PAGE -->
    <img class="hug-gif"
        src="https://media.giphy.com/media/IzXiddo2twMmdmU8Lv/giphy.gif"
        alt="Milk and Mocha super cute bear hug">

    <button class="hug-btn" onclick="openHug()">💖 Open Special Hug 💖</button>
</div>

<script>
function openHug(){
    const hugPage = `
    <!DOCTYPE html>
    <html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Warmest Hug For You 💕</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Dancing+Script:wght@400;700&family=Quicksand:wght@400;500&display=swap" rel="stylesheet">

    <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{
        margin:0;
        font-family:'Poppins',sans-serif;
        background:linear-gradient(135deg,#ff9a9e 0%,#fecfef 50%,#fad0c4 100%);
        min-height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        overflow:hidden;
        position:relative;
    }
    body::before{
        content:'💖';
        position:fixed;
        font-size:2rem;
        animation:float 5s infinite linear;
        pointer-events:none;
    }
    @keyframes float{
        0%{transform:translateY(100vh) rotate(0deg);opacity:0;}
        10%{opacity:1;}
        90%{opacity:1;}
        100%{transform:translateY(-100px) rotate(360deg);opacity:0;}
    }
    .box{
        text-align:center;
        padding:50px 25px;
        background:rgba(255,255,255,0.15);
        backdrop-filter:blur(20px);
        border-radius:30px;
        box-shadow:0 30px 70px rgba(0,0,0,0.25);
        max-width:450px;
        width:90%;
    }
    img{
        max-width:380px;
        width:100%;
        height:260px;
        object-fit:cover;
        border-radius:25px;
        border:8px solid rgba(255,255,255,0.3);
        box-shadow:0 25px 50px rgba(0,0,0,0.3);
        margin-bottom:30px;
    }
    .msg{
        font-family:'Dancing Script',cursive;
        font-size:clamp(2.2rem,7vw,3.5rem);
        background:linear-gradient(45deg,#ff6b9d,#ff9a8b,#fecfef);
        -webkit-background-clip:text;
        -webkit-text-fill-color:transparent;
        background-clip:text;
        margin:20px 0;
        animation:beat 1.5s infinite ease-in-out;
        text-shadow:0 4px 20px rgba(255,255,255,0.3);
    }
    @keyframes beat{
        0%,100%{transform:scale(1);}
        50%{transform:scale(1.08);}
    }
    .tiny-heart{
        position:absolute;
        font-size:1rem;
        pointer-events:none;
        animation:float 4s infinite linear;
    }
    </style>
    </head>

    <body>
    <div class="box">
        <img src="https://media.giphy.com/media/XQLerr4AvPJpwHq63x/giphy.gif">
        <div class="msg">Me when I see you next timeee 💕😘💋✨</div>
    </div>

    <script>
    setInterval(()=>{
        const heart=document.createElement('div');
        heart.className='tiny-heart';
        heart.innerHTML='💖';
        heart.style.left=Math.random()*100+'vw';
        heart.style.animationDuration=(3+Math.random()*2)+'s';
        document.body.appendChild(heart);
        setTimeout(()=>heart.remove(),5000);
    },800);
    </script>
    </body>
    </html>
    `;

    const newTab = window.open('', '_blank');
    newTab.document.write(hugPage);
    newTab.document.close();
}
</script>

</body>
</html>
