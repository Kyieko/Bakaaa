<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Will you be my Valentine? 🥰</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      text-align: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fecfef);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
      overflow: hidden;
    }

    .card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.3);
      width: min(90vw, 380px);
      max-width: 380px;
      position: relative;
      transition: transform 0.3s ease;
    }

    .card:hover {
      transform: scale(1.02);
    }

    h1 {
      font-size: clamp(20px, 5vw, 24px);
      color: #333;
      margin-bottom: 20px;
      line-height: 1.3;
    }

    /* YAY excitement animation */
    @keyframes yayBounce {
      0%, 20%, 50%, 80%, 100% { transform: translateY(0) scale(1); }
      40% { transform: translateY(-20px) scale(1.05); }
      60% { transform: translateY(-10px) scale(1.02); }
      10%, 30% { transform: translateY(-5px) scale(1.01); }
    }

    .yay-excited {
      animation: yayBounce 1.2s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
      color: #ff4d6d !important;
      text-shadow: 0 0 10px rgba(255, 77, 109, 0.5);
    }

    .buttons {
      display: flex;
      gap: 15px;
      justify-content: center;
      position: relative;
      height: 50px;
    }

    button {
      padding: 12px 24px;
      font-size: clamp(14px, 4vw, 16px);
      border: none;
      border-radius: 25px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    #yesBtn {
      background: linear-gradient(135deg, #ff4d6d, #ff6b9d);
      color: white;
    }

    #yesBtn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 77, 109, 0.4);
    }

    #noBtn {
      background: linear-gradient(135deg, #ddd, #f5f5f5);
      color: #666;
      transform-origin: center;
    }

    #noBtn:hover:not(.final) {
      transform: translateY(-2px) scale(1.05);
    }

    #noBtn.shrunk {
      background: linear-gradient(135deg, #bbb, #eee);
      color: #999;
    }

    /* Sobbing animation */
    @keyframes sob {
      0%, 100% { transform: translateY(0px) scale(1); }
      25% { transform: translateY(-2px) scale(1.02); }
      50% { transform: translateY(1px) scale(0.98); }
      75% { transform: translateY(-1px) scale(1.01); }
    }

    #noBtn.sobbing {
      animation: sob 0.4s ease-in-out;
    }

    .gif-container {
      position: relative;
      width: 220px;
      height: 180px;
      margin: 15px auto 0;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    .gif-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .response-text {
      font-size: clamp(16px, 4vw, 18px);
      color: #ff4d6d;
      margin: 10px 0;
    }

    /* Heart particles */
    @keyframes hearts {
      0% { transform: translateY(0) scale(0); opacity: 1; }
      100% { transform: translateY(-100vh) scale(1); opacity: 0; }
    }

    .heart {
      position: fixed;
      font-size: 20px;
      pointer-events: none;
      z-index: 1000;
      animation: hearts 2s ease-out forwards;
    }

    @media (max-width: 480px) {
      .card {
        padding: 30px 20px;
        margin: 20px;
      }
      .gif-container {
        width: 200px;
        height: 160px;
      }
    }
  </style>
</head>
<body>

  <div class="card" id="card">
    <h1>Bakaaaa 🥺<br>Will you be my Valentine? 👉🏻👈🏻</h1>

    <div class="buttons">
      <button id="yesBtn" aria-label="Yes, I'll be your Valentine">Yes 💖</button>
      <button id="noBtn" aria-label="No">No 💔</button>
    </div>
  </div>

  <script>
    let noClicks = 0;
    const MAX_CLICKS = 8;
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const card = document.getElementById("card");

    // Web Audio API for sobbing sound
    let audioContext;
    function initAudio() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playSobSound(pitch = 800, duration = 0.3) {
      initAudio();
      const oscillator = audioContext.createOscillator();
      const gainNode = audioContext.createGain();
      
      oscillator.connect(gainNode);
      gainNode.connect(audioContext.destination);
      
      oscillator.frequency.setValueAtTime(pitch, audioContext.currentTime);
      oscillator.frequency.exponentialRampToValueAtTime(pitch * 0.7, audioContext.currentTime + duration);
      
      gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);
      
      oscillator.start(audioContext.currentTime);
      oscillator.stop(audioContext.currentTime + duration);
    }

    function createHeart() {
      const heart = document.createElement('div');
      heart.innerHTML = '💖';
      heart.className = 'heart';
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = (Math.random() * 1 + 1.5) + 's';
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 2500);
    }

    yesBtn.onclick = function () {
      for (let i = 0; i < 10; i++) {
        setTimeout(createHeart, i * 200);
      }
      card.innerHTML = `
        <h1 class="yay-excited">YAYYYY!!! 💕✨</h1>
        <p class="response-text">I LOVE YOUUU 😚😭💖</p>
        <div class="gif-container">
          <iframe src="https://giphy.com/embed/Lv2VhwHrt6ljhvZ6LF?media=embed" alt="Kawaii love celebration"></iframe>
        </div>
      `;
    };

    function handleNoInteraction() {
      noClicks++;
      
      // Play sobbing sound with varying pitch
      playSobSound(600 + Math.random() * 400, 0.25 + Math.random() * 0.15);
      
      // Add sobbing animation
      noBtn.classList.add('sobbing');
      setTimeout(() => noBtn.classList.remove('sobbing'), 400);
      
      if (noClicks < MAX_CLICKS) {
        const scale = Math.max(0.4, 1 - (noClicks / MAX_CLICKS) * 0.6);
        noBtn.style.transform = `scale(${scale})`;
        noBtn.style.fontSize = `${Math.max(10, 16 - noClicks * 0.8)}px`;
        noBtn.classList.add('shrunk');

        const rect = card.getBoundingClientRect();
        const x = Math.random() * (rect.width - 80) + 10;
        const y = Math.random() * (rect.height - 120) + 60;
        noBtn.style.position = 'absolute';
        noBtn.style.left = x + 'px';
        noBtn.style.top = y + 'px';
        noBtn.style.zIndex = '10';
        noBtn.style.width = 'auto';

      } else if (noClicks === MAX_CLICKS) {
        // Final sad sob
        playSobSound(400, 0.5);
        noBtn.style.transform = 'scale(0.2)';
        noBtn.style.opacity = '0.5';
        noBtn.classList.add('final');
        noBtn.textContent = '😢';
        setTimeout(() => {
          card.innerHTML = `
            <h1>Why Babeee?... 🥺💔</h1>
            <p class="response-text">Do you not Lobe me!! 😭</p>
            <div class="gif-container">
              <iframe src="https://giphy.com/embed/98MaHVwJOmWMz4cz1K?media=embed" alt="Sad hamster crying"></iframe>
            </div>
          `;
        }, 500);
      }
    }

    noBtn.addEventListener("mouseover", handleNoInteraction);
    noBtn.addEventListener("click", handleNoInteraction);
  </script>

</body>

</html>
