<!DOCTYPE html>
<html>
<head>
  <title>Valentine's Week</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

<!-- Floating background -->
<div class="floating"></div>

<!-- DVD-style floating text -->
<div id="dvdText">
  Happy Valentine’s Day 💖<br>
  my lovbbveee<br>
  💋😘😘💋💋😘 🫦
</div>

<h1>
  Valentine’s Week 💖  
  <br>for you my bebeee 🫣🥰💋
</h1>

<div class="container">
  <a href="rose-day.html" class="day">🌹 Rose Day</a>
  <a href="propose-day.html" class="day">💍 Propose Day</a>
  <a href="chocolate.html" class="day">🍫 Chocolate Day</a>
  <a href="teddy.html" class="day">🧸 Teddy Day</a>
  <a href="promise.html" class="day">🤝 Promise Day</a>
  <a href="hug.html" class="day">🐽 Hug Day</a>
  <a href="kiss.html" class="day">💋 Kiss Day</a>

  <!-- 💘 ONLY THIS ONE POPS -->
  <a href="valentine.html" class="day valentine">💘 Valentine’s Day 💘</a>
</div>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #FFB6C1, #FF69B4);
  overflow-x: hidden;
}

h1 {
  text-align: center;
  color: #8B008B;
  margin: 20px;
}

/* Container */
.container {
  max-width: 260px;
  margin: 0 auto 60px;
  display: flex;
  flex-direction: column;
  gap: 15px;
  position: relative;
  z-index: 2;
}

/* 🌸 Calm off-white days */
.day {
  background: linear-gradient(135deg, #FFF7FB, #FFE4EF);
  color: #C71585;
  padding: 20px;
  border-radius: 20px;
  font-size: 18px;
  font-weight: bold;
  text-decoration: none;
  text-align: center;
  box-shadow:
    0 6px 15px rgba(255,255,255,0.6),
    0 6px 15px rgba(255,182,193,0.6);
  transition: 0.3s ease;
}

/* Soft hover only */
.day:hover {
  transform: scale(1.06);
  box-shadow:
    0 10px 25px rgba(255,255,255,0.9),
    0 10px 25px rgba(255,182,193,0.9);
}

/* 💘 Valentine is SPECIAL */
.valentine {
  font-size: 20px;
  border-radius: 30px;
  color: white;
  background: linear-gradient(135deg, #FF1493, #FF0000);
  box-shadow: 0 12px 35px rgba(255,20,147,0.8);
  animation: pop 1.2s infinite, glowStrong 1.5s infinite;
}

/* Animations */
@keyframes pop {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.08); }
}

@keyframes glowStrong {
  0%,100% { box-shadow: 0 12px 35px rgba(255,20,147,0.8); }
  50% { box-shadow: 0 20px 45px rgba(255,105,180,1); }
}

/* Floating hearts & balloons */
.floating span {
  position: fixed;
  bottom: -30px;
  font-size: 24px;
  animation: floatUp linear infinite;
  z-index: 1;
  pointer-events: none;
}

@keyframes floatUp {
  from { transform: translateY(0); opacity: 1; }
  to { transform: translateY(-120vh); opacity: 0; }
}

/* 💜 DVD floating text */
#dvdText {
  position: fixed;
  top: 40px;
  left: 40px;
  text-align: center;
  font-size: 18px;
  font-weight: bold;
  line-height: 1.3;
  color: #FFF0F5;
  padding: 12px 18px;
  background: linear-gradient(135deg, #D8B4E2, #C084FC);
  border-radius: 22px;
  box-shadow: 0 10px 25px rgba(192,132,252,0.6);
  z-index: 4;
  pointer-events: none;
}
</style>

<script>
/* Floating background emojis */
const emojis = ["💖","💕","💘","💋","🎈"];
const floating = document.querySelector(".floating");

setInterval(() => {
  const span = document.createElement("span");
  span.innerHTML = emojis[Math.floor(Math.random() * emojis.length)];
  span.style.left = Math.random() * 100 + "vw";
  span.style.animationDuration = (5 + Math.random() * 5) + "s";
  floating.appendChild(span);
  setTimeout(() => span.remove(), 10000);
}, 400);

/* Click fireworks */
document.addEventListener("click", e => {
  for (let i = 0; i < 5; i++) {
    const spark = document.createElement("span");
    spark.innerHTML = Math.random() > 0.5 ? "💖" : "💋";
    spark.style.position = "fixed";
    spark.style.left = e.clientX + "px";
    spark.style.top = e.clientY + "px";
    spark.style.fontSize = "20px";
    spark.style.transition = "1s";
    spark.style.zIndex = 3;
    document.body.appendChild(spark);

    setTimeout(() => {
      spark.style.transform =
        `translate(${Math.random()*120-60}px, ${Math.random()*-120}px)`;
      spark.style.opacity = 0;
    }, 10);

    setTimeout(() => spark.remove(), 1200);
  }
});

/* DVD-style floating text movement */
const dvd = document.getElementById("dvdText");
let x = 40, y = 40;
let dx = 1.1, dy = 1.1;

function moveDVD() {
  const maxX = window.innerWidth - dvd.offsetWidth;
  const maxY = window.innerHeight - dvd.offsetHeight;

  x += dx;
  y += dy;

  if (x <= 0 || x >= maxX) dx *= -1;
  if (y <= 0 || y >= maxY) dy *= -1;

  dvd.style.left = x + "px";
  dvd.style.top = y + "px";

  requestAnimationFrame(moveDVD);
}

moveDVD();
</script>

</body>
</html>
