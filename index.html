<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Rose Day, Babeee! 🌻🌹</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: linear-gradient(135deg, #ffd93d, #ff6b9d, #ffcc02);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            color: #d63031;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
        }
        h1 {
            font-size: 2.8em;
            margin: 10px 0;
            animation: glow 2s ease-in-out infinite alternate;
            font-weight: bold;
        }
        .subtitle {
            font-size: 1.4em;
            margin: 10px 0 20px 0;
            font-style: italic;
        }
        p.message {
            font-size: 1.6em;
            margin: 20px 40px;
            text-align: center;
            line-height: 1.4;
        }
        .flower {
            font-size: 5em;
            animation: sway 4s ease-in-out infinite;
            margin: 10px;
        }
        .rose { animation-delay: 0.5s; }
        .sunflower { animation-delay: 1s; }
        @keyframes glow {
            from { text-shadow: 1px 1px 2px rgba(255,255,255,0.8), 0 0 20px #ff6b9d; }
            to { text-shadow: 1px 1px 2px rgba(255,255,255,0.8), 0 0 30px #ffd93d; }
        }
        @keyframes sway {
            0%, 100% { transform: rotate(-5deg) scale(1); }
            50% { transform: rotate(5deg) scale(1.05); }
        }
        .hearts {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="hearts" id="hearts"></div>
    
    <div class="flower rose">🌹</div>
    <div class="flower sunflower">🌻</div>
    
    <h1>Happy Rose Day, Babeee! 🌹</h1>
    <p class="subtitle">But since you like sunflowers...</p>
    
    <p class="message">
        Here's a rose for the day, <br>
        and sunflowers for my sunshine! ☀️<br>
        😘😘💋💋💋💋💋💋 💕🌻
    </p>
    
    <div class="flower sunflower">🌻</div>
    <div class="flower rose">🌹</div>

    <script>
        function createHeart() {
            const hearts = ['💖', '💛', '🌹', '🌻'];
            const heart = document.createElement('div');
            heart.innerHTML = hearts[Math.floor(Math.random() * hearts.length)];
            heart.style.position = 'fixed';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.bottom = '-10px';
            heart.style.animation = 'float 5s linear infinite';
            heart.style.fontSize = Math.random() * 25 + 20 + 'px';
            heart.style.zIndex = '10';
            document.getElementById('hearts').appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 5000);
        }

        setInterval(createHeart, 350);

        const style = document.createElement('style');
        style.textContent = `
            @keyframes float {
                0% {
                    transform: translateY(0) rotate(0deg);
                    opacity: 1;
                }
                100% {
                    transform: translateY(-120vh) rotate(720deg);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
