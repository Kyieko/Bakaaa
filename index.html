  <title>Valentine's Week Days</title>

  <span>💋</span>
  <span>😘</span>

  <span>😗</span>
  <span>😙</span>
</div>

<h1>
  Valentine's Week Thing <br>
  for you my bebeee 🫣☺️🫠😘
</h1>

<div class="container">
  <a href="rose-day.html" target="_blank" class="normal-day">🌹 Rose Day</a>
  <a href="propose-day.html" target="_blank" class="normal-day">💍 Propose Day</a>
  <a href="chocolate.html" target="_blank" class="normal-day">🍫 Chocolate Day</a>
  <a href="teddy.html" target="_blank" class="normal-day">🧸 Teddy Day</a>

  <!-- 💋 KISS DAY -->
  <a href="kiss.html" target="_blank" class="kiss-day">
    <span class="kiss-text">💋 KISS DAY</span>
  </a>

  <div class="locked-day">🔒 Valentine's Day</div>
</div>

<style>
body {
  font-family: Arial, sans-serif;
  background: linear-gradient(to right, #FFB6C1, #FF69B4);
  padding: 20px;
  margin: 0;
  overflow-x: hidden;
}

h1 {
  text-align: center;
  color: #8B008B;
}

/* Layout */
.container {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 15px;
  max-width: 250px;
  margin: 0 auto;
}

/* Normal buttons */
.normal-day {
  background-color: #FF69B4;
  color: white;
  padding: 20px;
  border-radius: 15px;
  text-align: center;
  font-size: 18px;
  box-shadow: 0 6px 12px rgba(0,0,0,0.3);
  text-decoration: none;
  width: 100%;
  font-weight: bold;
  transition: 0.3s;
}

.normal-day:hover {
  transform: translateY(-3px);
}

/* 💋 Kiss Day */
.kiss-day {
  background: linear-gradient(135deg, #FF69B4, #FF1493);
  padding: 22px;
  border-radius: 25px;
  width: 100%;
  text-align: center;
  box-shadow: 0 10px 25px rgba(255,105,180,0.6);
  text-decoration: none;
}

.kiss-day,
.kiss-day span {
  color: white;
  text-decoration: none;
}

.kiss-text {
  font-size: 20px;
  font-weight: bold;
  display: inline-block;
  animation: kissPop 2s infinite;
}

@keyframes kissPop {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.15); }
}

/* 🔒 Locked */
.locked-day {
  background: #ccc;
  color: #666;
  padding: 20px;
  border-radius: 15px;
  width: 100%;
  text-align: center;
  opacity: 0.6;
}

/* 💋 Floating kisses */
.kisses {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 0;
}

.kisses span {
  position: absolute;
  bottom: -50px;
  animation: floatUp linear infinite;
  opacity: 0.8;
}

/* randomness */
.kisses span:nth-child(1)  { left: 5%;  font-size: 22px; animation-duration: 7s; }
.kisses span:nth-child(2)  { left: 15%; font-size: 26px; animation-duration: 9s; }
.kisses span:nth-child(3)  { left: 25%; font-size: 20px; animation-duration: 6s; }
.kisses span:nth-child(4)  { left: 35%; font-size: 28px; animation-duration: 10s; }
.kisses span:nth-child(5)  { left: 45%; font-size: 24px; animation-duration: 8s; }
.kisses span:nth-child(6)  { left: 55%; font-size: 30px; animation-duration: 11s; }
.kisses span:nth-child(7)  { left: 65%; font-size: 22px; animation-duration: 7s; }
.kisses span:nth-child(8)  { left: 75%; font-size: 26px; animation-duration: 9s; }
.kisses span:nth-child(9)  { left: 85%; font-size: 20px; animation-duration: 6s; }
.kisses span:nth-child(10) { left: 95%; font-size: 28px; animation-duration: 10s; }

@keyframes floatUp {
  0% {
    transform: translateY(0) scale(0.8);
    opacity: 0;
  }
  20% { opacity: 0.9; }
  100% {
    transform: translateY(-110vh) scale(1.3);
    opacity: 0;
  }
}
</style>

</body>
</html>
